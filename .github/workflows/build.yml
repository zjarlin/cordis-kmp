name: build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: JVM 测试
        run: ./gradlew :cordis-kmp:jvmTest --console=plain

      - name: JS 测试
        run: ./gradlew :cordis-kmp:jsNodeTest --console=plain

      - name: 示例可运行
        run: ./gradlew :sample:run --console=plain

      - name: 运行时 wasm 插件示例
        run: ./gradlew :sample:wasmDemo --console=plain

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/**'
